<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Legend of Zelda 40th Anniversary</title>
  <link rel="stylesheet" href="https://use.typekit.net/kyl3skh.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <section class="result-section">

    <header class="top-nav">
      <div class="nintendo-logo">Nintendo</div>
      
      <div class="nav-actions">
        <div class="search-pill">
          <p class="icon">🔍</p>
          <p>Search</p>
        </div>
        <button class="icon-btn" aria-label="Wishlist">♥</button>
        <button class="icon-btn" aria-label="Cart">🛒</button>
        <a href="#login" class="login-btn">👤 Log in / Sign up</a>
      </div>
    </header>

    <div class="page-wrapper">
      
      <input type="checkbox" id="menu-toggle" class="menu-checkbox">

      <div class="left-sidebar">
        <div class="triforce-top">
          <div class="tri-up"></div>
          <div class="tri-row">
            <div class="tri-up"></div>
            <div class="tri-up"></div>
          </div>
        </div>

        <label for="menu-toggle" class="menu-trigger">
          <div class="hamburger-lines">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
          </div>
          <p class="menu-label">
            <span class="text-menu">MENU</span>
            <span class="text-close">CLOSE</span>
          </p>
        </label>

        <div class="sidebar-spacer"></div>
      </div>

      <nav class="nav-drawer">
        <div class="drawer-inner">
          <img src="header-logo.avif" alt="The Legend of Zelda 40th Anniversary Crest" class="drawercrest">

          <ul class="drawer-links">
            <li><a href="#home" class="drawer-link active">Home</a></li>
            <li><a href="#triforce" class="drawer-link">Triforce</a></li>
            <li><a href="#timeline" class="drawer-link">Timeline</a></li>
            <li><a href="#history" class="drawer-link">History</a></li>
            <li><a href="#news" class="drawer-link">News</a></li>
          </ul>
        </div>
      </nav>

      <main class="hero-stage">
        <img src="header-logo.avif" alt="The Legend of Zelda 40th Anniversary Crest" class="crest">
      </main>

    </div>

    <div class="lower-banner"></div>
  </section>

</body>
</html>
